<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="/assets/css/main.css">
  </head>
  <body class="contact-us">
    <header class="site-header">
      <div class="header-inner">
       <img src="/assets/images/logo.png">
        <button class="nav-toggle" type="button" aria-controls="primary-nav" aria-expanded="false">Menu</button>
        <nav id="primary-nav" class="site-nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/about-us/">About</a>
          <a href="/support-us/">Support Us</a>
          <a href="/newsletter/">Newsletter</a>
          <a href="/gift-shop/">Gift Shop</a>
          <a href="/links/">Our Community</a>
          <a href="/contact-us/">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <h2>Contact Us</h2>
<ul>
<li>We want to hear from you!</li>
<li>Contact Form</li>
</ul>

    </main>

    <footer>
     <p>&copy; 2026 Historical Glass Museum</p>
     </footer>
    <script>
      (() => {
        const header = document.querySelector('.site-header');
        const btn = document.querySelector('.nav-toggle');
        const nav = document.querySelector('#primary-nav');
        if (!header || !btn || !nav) return;

        const close = () => {
          header.removeAttribute('data-nav-open');
          btn.setAttribute('aria-expanded', 'false');
        };

        btn.addEventListener('click', () => {
          const open = header.getAttribute('data-nav-open') === 'true';
          if (open) {
            close();
          } else {
            header.setAttribute('data-nav-open', 'true');
            btn.setAttribute('aria-expanded', 'true');
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') close();
        });

        window.addEventListener('resize', () => {
          if (window.matchMedia('(min-width: 600px)').matches) close();
        });
      })();
    </script>
  </body>
</html>
